name: Build IPTVita VPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vita-build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        shell: sh
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash cmake make git
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash cmake make git ca-certificates
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build independent IPTVita shell
        shell: bash
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          test -s build/IPTVita.vpk

      - name: Publish installable VPK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVita-vpk
          path: build/IPTVita.vpk
          if-no-files-found: error
